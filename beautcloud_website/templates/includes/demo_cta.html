<section class="bc-section bc-section-plum">
	<div class="bc-wrap bc-cta">
		<p class="bc-eyebrow">{{ cta.eyebrow }}</p>
		<h2 class="bc-h2">{{ cta.title }}</h2>
		<p class="bc-lead">{{ cta.text }}</p>
		<div class="bc-actions">
			<a class="bc-btn bc-btn-primary" href="{{ cta.primary_route }}">{{ cta.primary_label }}</a>
			<a class="bc-btn bc-btn-ghost" href="{{ cta.secondary_route }}" style="border-color:rgba(255,255,255,.25);color:#fff;">{{ cta.secondary_label }}</a>
		</div>
	</div>
</section>
