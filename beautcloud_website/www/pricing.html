<!-- base_template: beautcloud_website/templates/layouts/beautcloud.html -->
<section class="bc-cinema" style="background-image:url('{{ page_image }}')">
	<div class="bc-cinema-shade"></div>
	<div class="bc-wrap bc-cinema-inner">
		<p class="bc-eyebrow">{{ site_page.eyebrow }}</p>
		<h1 class="bc-h1">{{ site_page.hero }}</h1>
		<p class="bc-lead">{{ site_page.lead }}</p>
	</div>
</section>
<section class="bc-section">
	<div class="bc-wrap bc-price">
		{% for plan in pricing %}
		<article class="{% if loop.index == 2 %}is-featured{% endif %}">
			<p class="bc-eyebrow">Plan {{ loop.index }}</p>
			<h2 class="bc-h3">{{ plan.name }}</h2>
			<p>{{ plan.text }}</p>
			<p class="bc-note">{{ site_page.note }}</p>
			<a class="bc-btn {% if loop.index == 2 %}bc-btn-primary{% else %}bc-btn-ghost{% endif %}" href="{{ plan.route }}">{{ plan.cta }}</a>
		</article>
		{% endfor %}
	</div>
</section>
{% include "beautcloud_website/templates/includes/demo_cta.html" %}
